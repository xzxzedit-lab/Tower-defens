<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pixel Defenders</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
<header><h1>PIXEL DEFENDERS</h1><div class="stats">
<div class="stat">🪙 <span id="gold">0</span></div><div class="stat">❤️ <span id="lives">0</span></div><div class="stat">🌊 <span id="wave">0/15</span></div>
</div></header>
<div id="gameWrap"><canvas id="game" width="640" height="384"></canvas><div id="toast"></div></div>
<div id="panel">
<button id="archer">🏹 Лучница (50)</button><button id="mage">✨ Маг (75)</button>
<button id="start">Начать волну</button><button id="upgrade" class="secondary" disabled>Улучшить</button><button id="sell" class="secondary" disabled>Продать</button>
<button id="pause" class="secondary">Пауза</button><button id="speed" class="secondary">1x</button><button id="restart" class="secondary">Заново</button>
</div>
<div id="hint"></div>
</div>
<script src="js/pd.js"></script><script src="assets/sprites/atlas.js"></script>
<script src="js/data/maps.js"></script><script src="js/data/towers.js"></script><script src="js/data/enemies.js"></script><script src="js/data/i18n.js"></script>
<script src="js/save.js"></script><script src="js/economy.js"></script><script src="js/enemies.js"></script><script src="js/towers.js"></script>
<script src="js/waves.js"></script><script src="js/physics.js"></script><script src="js/game.js"></script>
<script src="js/sprites.js"></script><script src="js/vfx.js"></script><script src="js/renderer.js"></script><script src="js/input.js"></script><script src="js/ui.js"></script><script src="js/main.js"></script>
</body></html>

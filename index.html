<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pixel Defenders</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#111827;color:#f8fafc;font-family:system-ui,Arial;display:flex;min-height:100vh;align-items:center;justify-content:center}
#app{width:min(100vw,1000px);padding:12px}header{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
h1{font-size:clamp(18px,4vw,28px);margin:0;color:#facc15;letter-spacing:1px}.stats{display:flex;gap:8px;flex-wrap:wrap}.stat{background:#263449;border:2px solid #475569;padding:7px 11px;border-radius:8px;font-weight:700}
#gameWrap{position:relative;border:4px solid #64748b;border-radius:10px;overflow:hidden;background:#274b36}
canvas{display:block;width:100%;height:auto;image-rendering:pixelated;touch-action:manipulation}
#panel{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
button{border:0;border-bottom:4px solid #854d0e;background:#facc15;color:#241b08;font-weight:800;padding:11px 14px;border-radius:8px;cursor:pointer;font-size:14px}
button:disabled{opacity:.45;cursor:not-allowed}button.secondary{background:#334155;color:white;border-bottom-color:#0f172a}
#hint{color:#cbd5e1;font-size:13px;margin:9px 2px;line-height:1.4}
#toast{position:absolute;left:50%;top:12px;transform:translateX(-50%);background:#0f172add;padding:8px 12px;border-radius:8px;display:none;font-weight:700;white-space:nowrap}
@media(max-width:600px){#app{padding:7px}.stat{padding:6px 8px;font-size:13px}button{flex:1;padding:10px 7px}}
</style>
</head>
<body>
<div id="app">
<header><h1>PIXEL DEFENDERS</h1><div class="stats">
<div class="stat">🪙 <span id="gold">120</span></div><div class="stat">❤️ <span id="lives">15</span></div><div class="stat">🌊 Волна <span id="wave">0</span></div>
</div></header>
<div id="gameWrap"><canvas id="game" width="800" height="480"></canvas><div id="toast"></div></div>
<div id="panel">
<button id="archer">🏹 Башня (50)</button><button id="mage">✨ Маг (75)</button><button id="start">Начать волну</button><button id="upgrade" class="secondary" disabled>Улучшить (40)</button>
</div>
<div id="hint">Выбери башню, затем нажми на свободную клетку травы. Башни автоматически защищают тропу. Выбери построенную башню, чтобы улучшить её.</div>
</div>
<script>
(() => {
const canvas=document.getElementById('game'),ctx=canvas.getContext('2d');
const $=id=>document.getElementById(id);
const tile=40, cols=20, rows=12;
const path=[[-1,5],[4,5],[4,2],[9,2],[9,8],[14,8],[14,4],[20,4]];
const towers=[],enemies=[],shots=[];
let gold=120,lives=15,wave=0,spawnLeft=0,spawnTimer=0,selectedType='archer',selectedTower=null,active=false,gameOver=false;
const dist=(a,b)=>Math.hypot(a.x-b.x,a.y-b.y);
function pointOnPath(x,y){for(let i=0;i<path.length-1;i++){let [ax,ay]=path[i],[bx,by]=path[i+1];if(ax===bx&&x===ax*tile+tile/2&&y>Math.min(ay,by)*tile&&y<Math.max(ay,by)*tile)return true;if(ay===by&&y===ay*tile+tile/2&&x>Math.min(ax,bx)*tile&&x<Math.max(ax,bx)*tile)return true;}return false}
function onPathCell(c,r){for(let i=0;i<path.length-1;i++){let [ax,ay]=path[i],[bx,by]=path[i+1];if(ax===bx&&c===ax&&r>=Math.min(ay,by)&&r<=Math.max(ay,by))return true;if(ay===by&&r===ay&&c>=Math.min(ax,bx)&&c<=Math.max(ax,bx))return true;}return false}
function updateUI(){$('gold').textContent=gold;$('lives').textContent=lives;$('wave').textContent=wave;$('upgrade').disabled=!selectedTower||gold<40||selectedTower.level>=3}
function toast(s){$('toast').textContent=s;$('toast').style.display='block';clearTimeout(toast.t);toast.t=setTimeout(()=>$('toast').style.display='none',1500)}
function drawTree(x,y){ctx.fillStyle='#17452f';ctx.fillRect(x-7,y-5,14,15);ctx.fillStyle='#2f7d45';ctx.fillRect(x-13,y-14,26,17);ctx.fillStyle='#58a85b';ctx.fillRect(x-7,y-20,14,8)}
function draw(){
 ctx.clearRect(0,0,800,480);
 for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){ctx.fillStyle=((r+c)%2)?'#397b48':'#347344';ctx.fillRect(c*tile,r*tile,tile,tile);ctx.fillStyle='#ffffff08';ctx.fillRect(c*tile+3,r*tile+3,2,2)}
 ctx.lineCap='square';ctx.lineJoin='bevel';ctx.strokeStyle='#9a7546';ctx.lineWidth=tile*.72;ctx.beginPath();path.forEach(([x,y],i)=>i?ctx.lineTo(x*tile+20,y*tile+20):ctx.moveTo(x*tile+20,y*tile+20));ctx.stroke();
 ctx.strokeStyle='#c5a16a';ctx.lineWidth=2;ctx.stroke();
 for(let i=0;i<12;i++)drawTree((i*73+31)%790,(i*97+22)%470);
 for(let t of towers){ctx.fillStyle=t===selectedTower?'#fef08a':'#475569';ctx.fillRect(t.x-15,t.y-15,30,30);ctx.fillStyle=t.type==='mage'?'#a78bfa':'#d6a56a';ctx.fillRect(t.x-10,t.y-12,20,20);ctx.fillStyle='#1e293b';ctx.fillRect(t.x-4,t.y-19,8,9);ctx.fillStyle='#fff';ctx.fillRect(t.x-2,t.y-17,4,4);if(t.level>1){ctx.fillStyle='#fde047';ctx.fillRect(t.x+9,t.y-16,7,7)}}
 for(let e of enemies){ctx.fillStyle='#172554';ctx.fillRect(e.x-11,e.y-10,22,20);ctx.fillStyle=e.boss?'#dc2626':'#65a30d';ctx.fillRect(e.x-9,e.y-12,18,18);ctx.fillStyle='#fff';ctx.fillRect(e.x-5,e.y-5,3,3);ctx.fillRect(e.x+3,e.y-5,3,3);ctx.fillStyle='#111827';ctx.fillRect(e.x-12,e.y-18,24,4);ctx.fillStyle='#ef4444';ctx.fillRect(e.x-12,e.y-18,24*Math.max(0,e.hp/e.maxHp),4)}
 for(let s of shots){ctx.fillStyle=s.color;ctx.fillRect(s.x-4,s.y-4,8,8)}
 if(!active&&!gameOver){ctx.fillStyle='#0f172a99';ctx.fillRect(0,0,800,480);ctx.fillStyle='white';ctx.textAlign='center';ctx.font='bold 28px monospace';ctx.fillText('PIXEL DEFENDERS',400,210);ctx.font='18px monospace';ctx.fillText('Построй башни и защити тропу!',400,250);ctx.fillText('Нажми «Начать волну»',400,282)}
 if(gameOver){ctx.fillStyle='#0f172add';ctx.fillRect(0,0,800,480);ctx.fillStyle='#fecaca';ctx.textAlign='center';ctx.font='bold 38px monospace';ctx.fillText('ИГРА ОКОНЧЕНА',400,220);ctx.font='20px monospace';ctx.fillText('Нажми «Начать волну», чтобы сыграть снова',400,265)}
}
let last=0;
function update(dt){
 if(active&&!gameOver){
  if(spawnLeft>0){spawnTimer-=dt;if(spawnTimer<=0){spawnEnemy();spawnLeft--;spawnTimer=.85}}
  for(let e of enemies){let target=path[e.segment+1];if(!target)continue;let tx=target[0]*tile+20,ty=target[1]*tile+20,dx=tx-e.x,dy=ty-e.y,d=Math.hypot(dx,dy)||1,step=e.speed*dt;e.x+=dx/d*step;e.y+=dy/d*step;if(d<step+2){e.segment++;if(e.segment>=path.length-1){e.dead=true;lives--;updateUI();if(lives<=0){gameOver=true;active=false;toast('Поселение нуждается в защите!')}}}}
  for(let t of towers){t.cool-=dt;if(t.cool<=0){let target=enemies.filter(e=>!e.dead&&dist(t,e)<t.range).sort((a,b)=>b.segment-a.segment)[0];if(target){shots.push({x:t.x,y:t.y,target,damage:t.damage,color:t.type==='mage'?'#c4b5fd':'#fde68a',speed:300});t.cool=t.rate}}}
  for(let s of shots){if(!s.target||s.target.dead){s.dead=true;continue}let dx=s.target.x-s.x,dy=s.target.y-s.y,d=Math.hypot(dx,dy)||1,step=s.speed*dt;if(d<step+5){s.target.hp-=s.damage;s.dead=true;if(s.target.hp<=0){s.target.dead=true;gold+=s.target.boss?35:12;updateUI()}}else{s.x+=dx/d*step;s.y+=dy/d*step}}
  for(let i=enemies.length-1;i>=0;i--)if(enemies[i].dead)enemies.splice(i,1);
  for(let i=shots.length-1;i>=0;i--)if(shots[i].dead)shots.splice(i,1);
  if(spawnLeft===0&&enemies.length===0){active=false;gold+=25;toast('Волна пройдена! +25 монет');updateUI();$('start').textContent='Следующая волна'}
 }
}
function spawnEnemy(){let boss=wave%5===0;enemies.push({x:20,y:220,segment:0,hp:(boss?150:35)+wave*8,maxHp:(boss?150:35)+wave*8,speed:(boss?30:42)+Math.min(wave,10)*1.5,boss,dead:false})}
function loop(ts){let dt=Math.min((ts-last)/1000||0,.04);last=ts;update(dt);draw();requestAnimationFrame(loop)}
function startWave(){if(active)return;if(gameOver){gold=120;lives=15;wave=0;enemies.length=0;towers.length=0;shots.length=0;gameOver=false;selectedTower=null;updateUI()}wave++;spawnLeft=6+wave*2;spawnTimer=.1;active=true;$('start').textContent='Волна идёт…';updateUI()}
function build(type){selectedType=type;$('archer').style.outline=type==='archer'?'3px solid white':'none';$('mage').style.outline=type==='mage'?'3px solid white':'none';toast(type==='mage'?'Выбрана магическая башня':'Выбрана башня лучницы')}
canvas.addEventListener('pointerdown',ev=>{const rect=canvas.getBoundingClientRect(),x=(ev.clientX-rect.left)*800/rect.width,y=(ev.clientY-rect.top)*480/rect.height,c=Math.floor(x/tile),r=Math.floor(y/tile),cx=c*tile+20,cy=r*tile+20;
 let hit=towers.find(t=>dist(t,{x:cx,y:cy})<20);if(hit){selectedTower=hit;updateUI();return}
 if(active||gameOver)return;if(c<0||r<0||c>=cols||r>=rows||onPathCell(c,r)){toast('Здесь нельзя строить');return}
 if(towers.some(t=>dist(t,{x:cx,y:cy})<30)){toast('Клетка занята');return}
 let cost=selectedType==='mage'?75:50;if(gold<cost){toast('Недостаточно монет');return}
 gold-=cost;towers.push({x:cx,y:cy,type:selectedType,range:selectedType==='mage'?125:105,damage:selectedType==='mage'?18:10,rate:selectedType==='mage'?.95:.55,cool:.2,level:1});selectedTower=towers[towers.length-1];updateUI()
});
$('archer').onclick=()=>build('archer');$('mage').onclick=()=>build('mage');$('start').onclick=startWave;
$('upgrade').onclick=()=>{if(!selectedTower||gold<40||selectedTower.level>=3)return;gold-=40;selectedTower.level++;selectedTower.damage*=1.55;selectedTower.range+=12;selectedTower.rate*=.88;updateUI();toast('Башня улучшена!')};
build('archer');updateUI();requestAnimationFrame(loop);
})();
</script>
</body></html>
